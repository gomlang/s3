name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    uses: gomlang/workflows/.github/workflows/ecosystem-ci.yml@778e1a9a9b3d38a15902f75100cfd801b950b741
    with:
      module: s3
      workflows-ref: 778e1a9a9b3d38a15902f75100cfd801b950b741
