name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    uses: gomlang/workflows/.github/workflows/ecosystem-ci.yml@b5d72f5114f12714ea407ff643fa4fef385195c1
    with:
      module: s3
      workflows-ref: b5d72f5114f12714ea407ff643fa4fef385195c1
